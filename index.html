<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motivação Cristã</title><style>body{font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;text-align:center;padding:20px;min-height:100vh;margin:0}h1{margin-top:30px}.card{background:#fff;color:#333;border-radius:20px;padding:25px;margin:30px auto;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.3)}button{background:#667eea;color:#fff;border:none;padding:12px 20px;border-radius:50px;font-size:16px;margin:8px;cursor:pointer}.share{background:#25D366}</style></head><body><h1>✝️ Motivação Cristã</h1><p>Uma palavra para seu dia</p><div class="card"><h2 id="v"></h2><p id="t"></p><button onclick="nova()">Nova Mensagem 🙏</button><br><button class="share" onclick="whats()">WhatsApp 📲</button><button onclick="copiar()">Copiar 📋</button></div><script>const m=[{v:"Isaías 41:10",t:"Não temas, porque eu sou contigo"},{v:"Filipenses 4:13",t:"Tudo posso naquele que me fortalece"},{v:"Jeremias 29:11",t:"Eu sei os planos que tenho para vocês"},{v:"Salmos 23:1",t:"O Senhor é o meu pastor, nada me faltará"},{v:"Romanos 8:28",t:"Tudo coopera para o bem de quem ama a Deus"},{v:"Josué 1:9",t:"Seja forte e corajoso"}];let a=0;function nova(){a=Math.floor(Math.random()*m.length);document.getElementById("v").innerText=m[a].v;document.getElementById("t").innerText=m[a].t}function whats(){let txt=m[a].v+": "+m[a].t+" https://samba328.github.io/Motiva-o-crist-/";window.open("https://wa.me/?text="+encodeURIComponent(txt))}function copiar(){navigator.clipboard.writeText(m[a].v+": "+m[a].t);alert("Copiado!")}nova();</script></body></html>
