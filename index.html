<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motivação Cristã</title><style>body{font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;text-align:center;padding:20px;min-height:100vh;margin:0}h1{margin-top:30px}.card{background:#fff;color:#333;border-radius:20px;padding:25px;margin:30px auto;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.3)}button{background:#667eea;color:#fff;border:none;padding:12px 20px;border-radius:50px;font-size:16px;margin:8px;cursor:pointer}.share{background:#25D366}</style></head><body><h1>✝️ Motivação Cristã</h1><p>Uma palavra para seu dia</p><div class="card"><h2 id="v">Carregando...</h2><p id="t"></p><button onclick="nova()">Nova Mensagem 🙏</button><br><button class="share" onclick="whats()">Compartilhar no WhatsApp</button><button onclick="copiar()">Copiar 📋</button></div><script>const m=[{v:"Isaías 41:10",t:"Não temas, porque eu sou contigo."},{v:"Filipenses 4:13",t:"Tudo posso naquele que me fortalece."},{v:"Jeremias 29:11",t:"Eu sei os planos que tenho para vocês, diz o Senhor."},{v:"Salmos 23:1",t:"O Senhor é o meu pastor, nada me faltará."},{v:"Romanos 8:28",t:"Todas as coisas cooperam para o bem daqueles que amam a Deus."},{v:"Provérbios 3:5",t:"Confie no Senhor de todo o seu coração."},{v:"Josué 1:9",t:"Seja forte e corajoso, não temas."},{v:"Salmos 46:1",t:"Deus é o nosso refúgio e fortaleza."},{v:"2 Coríntios 12:9",t:"A minha graça te basta, porque o meu poder se aperfeiçoa na fraqueza."},{v:"Salmos 121:2",t:"O meu socorro vem do Senhor."},{v:"Mateus 11:28",t:"Vinde a mim, todos os que estais cansados."},{v:"Filipenses 4:6",t:"Não andeis ansiosos por coisa alguma."},{v:"Salmos 37:5",t:"Entrega o teu caminho ao Senhor, confia nele."},{v:"Isaías 40:31",t:"Os que esperam no Senhor renovarão as forças."},{v:"João 16:33",t:"No mundo tereis aflições, mas tende bom ânimo."}];let a=0;function nova(){a=Math.floor(Math.random()*m.length);document.getElementById("v").innerText=m[a].v;document.getElementById("t").innerText=m[a].t}function whats(){let txt=m[a].v+": "+m[a].t+" - via Motivação Cristã ✝️ https://samba328.github.io/Motiva-o-crist-/";window.open("https://wa.me/?text="+encodeURIComponent(txt))}function copiar(){navigator.clipboard.writeText(m[a].v+": "+m[a].t);alert("Copiado! 📋")}nova();</script></body></html>
